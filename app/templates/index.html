<!DOCTYPE html>
<html>
<style>
body{
    margin:0;
    height:100vh;
    display:grid;
    place-items:centre;
    background:#09090b;
    color:white;
    font-family:arial;
}
.card{
    width:300px;
    padding:35px;
    text-align:centre;
    background:#151518;
    border:1px solid #333;
    border-radius:25px;
}
.mic{
    width:90px;
    height:90px;
    border:0;
    border-radius:50%;
    font-size:35px;
    cursor:pointer;
}
.status{
    margin-top:20px;
    color:#aaa;
}
.song{
    margin-top:10px;
    font-size:13px;
}
.listening{
    transform:scale(1.1);
    box-shadow:0 0 0 10px #ffffff18;
}
</style>
<head>
    <title>Nova AI</title>
</head>

<body>
<div class="card">
    <h2>Nova AI</h2>
    <p>Say a song name</p>
    <button id="mic" class="mic">
    </button>
    <div id="status" class="status">
        tap microphone
    </div>    
</body>

</html>
